name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write # to publish the release Obtainium watches
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore signing key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Test and build
        run: gradle testReleaseUnitTest assembleRelease
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk dead-ground-0.1.${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Dead Ground 0.1.${{ github.run_number }}
          files: dead-ground-0.1.${{ github.run_number }}.apk
